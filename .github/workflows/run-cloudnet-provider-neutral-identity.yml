name: Qualify provider-neutral CloudNet identity

on:
  pull_request:
    paths:
      - 'tools/run_cloudnet_provider_neutral_identity_rep.py'
      - '.github/workflows/run-cloudnet-provider-neutral-identity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-neutral-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout COLLAGE
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up JDK 25
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287
        with:
          distribution: zulu
          java-version: '25'
      - name: Derive and fence CloudNet identity from stable service UUID
        run: python3 tools/run_cloudnet_provider_neutral_identity_rep.py
      - name: Publish evidence
        if: always()
        shell: bash
        run: |
          {
            echo '### EXP-000-CLOUDNET-001 provider-neutral identity derivation'
            if [[ -f cloudnet-provider-neutral-identity-evidence.json ]]; then
              echo 'BEGIN_JSON'
              cat cloudnet-provider-neutral-identity-evidence.json
              echo 'END_JSON'
            else
              echo 'No PASS evidence file was produced.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
