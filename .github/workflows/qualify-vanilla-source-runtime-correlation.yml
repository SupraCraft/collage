name: COLLAGE OP-3B same artifact source-plan and real vanilla runtime correlation
on:
  pull_request:
    paths:
      - 'tools/correlate_vanilla_runtime_source.py'
      - 'tests/test_correlate_vanilla_runtime_source.py'
      - '.github/workflows/qualify-vanilla-source-runtime-correlation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: collage-vanilla-source-runtime-${{ github.ref }}
  cancel-in-progress: false
jobs:
  real-consumer-bridge:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - name: Checkout exact COLLAGE consumer source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout accepted exact datapack producer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SupraCraft/mc-server-images
          ref: 7f888b5829f4e5576d5ce512d86327348c43f01e
          path: .deps/vanilla-producer
          persist-credentials: false
      - name: Checkout independently accepted direct vanilla runtime qualifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SupraCraft/mc-server-images
          ref: 2906aa1bc0ccb2f2da3a7e61adea1ea88dfc3aaa
          path: .deps/vanilla-runtime
          persist-credentials: false
      - name: Cheap source and authority gates
        run: |
          set -euo pipefail
          test "$(git -C .deps/vanilla-producer rev-parse HEAD)" = '7f888b5829f4e5576d5ce512d86327348c43f01e'
          test "$(git -C .deps/vanilla-runtime rev-parse HEAD)" = '2906aa1bc0ccb2f2da3a7e61adea1ea88dfc3aaa'
          python3 -m py_compile tools/correlate_vanilla_runtime_source.py
          python3 -m unittest discover -s tests -p 'test_correlate_vanilla_runtime_source.py' -v
          python3 -m unittest discover -s tests -p 'test_consume_vanilla_datapack_source.py' -v
      - uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287
        with:
          distribution: temurin
          java-version: '25'
      - name: Export exact candidate inner ZIP from accepted immutable producer
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/collage-op3"
          python3 .deps/vanilla-producer/tools/export_core_restoration_datapack_26_3.py \
            --out "$RUNNER_TEMP/collage-op3/lantern-restoration-26.3.zip" \
            --manifest "$RUNNER_TEMP/collage-op3/lantern-restoration-26.3.json" \
            --world-id lantern-rdte --release-id lantern-core-restore-26-3
      - name: Three-audience read-only COLLAGE source-plan parity
        run: |
          set -euo pipefail
          python3 tools/consume_vanilla_datapack_source.py \
            --manifest "$RUNNER_TEMP/collage-op3/lantern-restoration-26.3.json" \
            --artifact "$RUNNER_TEMP/collage-op3/lantern-restoration-26.3.zip" \
            --artifact-root "$RUNNER_TEMP/collage-op3" \
            > "$RUNNER_TEMP/collage-op3/source-plans.json"
      - name: Independent real vanilla 26.3 world activation and rollback
        run: |
          set -euo pipefail
          python3 .deps/vanilla-runtime/tools/qualify_vanilla_world_artifact_activation_263.py \
            --candidate "$RUNNER_TEMP/collage-op3/lantern-restoration-26.3.zip" \
            --manifest "$RUNNER_TEMP/collage-op3/lantern-restoration-26.3.json" \
            --evidence .deps/vanilla-runtime/probes/26.3-release-identity.json \
            --out "$RUNNER_TEMP/collage-op3/real-vanilla-runtime.json"
      - name: Independently correlate exact artifact without privilege promotion
        run: |
          set -euo pipefail
          python3 tools/correlate_vanilla_runtime_source.py \
            --manifest "$RUNNER_TEMP/collage-op3/lantern-restoration-26.3.json" \
            --source-receipt "$RUNNER_TEMP/collage-op3/source-plans.json" \
            --runtime-receipt "$RUNNER_TEMP/collage-op3/real-vanilla-runtime.json" \
            --out "$RUNNER_TEMP/collage-op3/correlation.json"
          python3 - "$RUNNER_TEMP/collage-op3/correlation.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r["classification"]=="SAME_ARTIFACT_SOURCE_PLAN_AND_INDEPENDENT_DISPOSABLE_RUNTIME_CONFIRMED"
          assert set(r["source_plan_audiences"])=={"human","automation","agent"}
          assert r["independent_vanilla_real_server_activation_pass"] is True
          assert r["independent_vanilla_rollback_pass"] is True
          assert r["collage_deployment_performed"] is False
          assert r["truenas_provider_observed"] is False
          assert r["principal_authentication_verified"] is False
          assert r["operational_selection"] is False
          assert r["physical_truenas_apply"]=="HOLD"
          PY
      - name: Retain compact receipts only, never game server, worlds, or credentials
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: collage-op3-source-runtime-correlation
          path: |
            ${{ runner.temp }}/collage-op3/source-plans.json
            ${{ runner.temp }}/collage-op3/real-vanilla-runtime.json
            ${{ runner.temp }}/collage-op3/correlation.json
          retention-days: 14
          if-no-files-found: warn
      - name: Explicit no-COLLAGE-deployment claim
        if: always()
        run: |
          echo 'Source-plan parity and independent direct vanilla fixture used the same artifact. No managed COLLAGE/CloudNet/TrueNAS deployment, real principal authorization, Gym player acceptance, Two Rivers world approval or physical APPLY.' >> "$GITHUB_STEP_SUMMARY"
