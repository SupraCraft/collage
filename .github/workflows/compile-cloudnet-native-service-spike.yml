name: Compile CloudNet native service spike

on:
  pull_request:
    paths:
      - 'tools/compile_cloudnet_native_service_spike.py'
      - '.github/workflows/compile-cloudnet-native-service-spike.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-spike:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout COLLAGE
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up JDK 25
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287
        with:
          distribution: zulu
          java-version: '25'
      - name: Compile native-runtime service probe against exact CloudNet source
        run: python3 tools/compile_cloudnet_native_service_spike.py
      - name: Publish evidence in job summary
        if: always()
        shell: bash
        run: |
          {
            echo '### EXP-000-CLOUDNET-001 compile spike'
            if [[ -f cloudnet-native-service-spike-evidence.json ]]; then
              echo 'BEGIN_JSON'
              cat cloudnet-native-service-spike-evidence.json
              echo 'END_JSON'
            else
              echo 'No PASS evidence file was produced.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
