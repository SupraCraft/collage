name: Qualify CloudNet identity fencing

on:
  pull_request:
    paths:
      - 'tools/run_cloudnet_identity_fencing_rep.py'
      - '.github/workflows/run-cloudnet-identity-fencing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity-fencing:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout COLLAGE
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up JDK 25
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287
        with:
          distribution: zulu
          java-version: '25'
      - name: Prove occupied CloudNet identity fails closed before backend path
        run: python3 tools/run_cloudnet_identity_fencing_rep.py
      - name: Publish evidence in job summary
        if: always()
        shell: bash
        run: |
          {
            echo '### EXP-000-CLOUDNET-001 identity fencing'
            if [[ -f cloudnet-identity-fencing-evidence.json ]]; then
              echo 'BEGIN_JSON'
              cat cloudnet-identity-fencing-evidence.json
              echo 'END_JSON'
            else
              echo 'No PASS evidence file was produced.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
