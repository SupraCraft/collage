name: Qualify CloudNet shutdown/delete semantics

on:
  pull_request:
    paths:
      - 'tools/run_cloudnet_shutdown_delete_semantics_rep.py'
      - '.github/workflows/run-cloudnet-shutdown-delete-semantics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shutdown-delete-semantics:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout COLLAGE
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up JDK 25
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287
        with:
          distribution: zulu
          java-version: '25'
      - name: Qualify real CloudNet shutdown and deleteFiles distinction
        run: python3 tools/run_cloudnet_shutdown_delete_semantics_rep.py
      - name: Publish evidence in job summary
        if: always()
        shell: bash
        run: |
          {
            echo '### EXP-000-CLOUDNET-001 shutdown/delete semantics'
            if [[ -f cloudnet-shutdown-delete-semantics-evidence.json ]]; then
              echo 'BEGIN_JSON'
              cat cloudnet-shutdown-delete-semantics-evidence.json
              echo 'END_JSON'
            else
              echo 'No PASS evidence file was produced.'
            fi
            if [[ -f cloudnet-shutdown-delete-semantics.log ]]; then
              echo '### CloudNet log tail'
              echo 'BEGIN_LOG'
              tail -n 180 cloudnet-shutdown-delete-semantics.log
              echo 'END_LOG'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
