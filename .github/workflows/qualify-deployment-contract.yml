name: Qualify COLLAGE deployment contract

on:
  pull_request:
    paths:
      - 'spec/deployment-request-v1.schema.json'
      - 'tools/collage_deploy_plan.py'
      - 'tools/collage_native_readback.py'
      - 'tools/collage_disposable_release_grant.py'
      - 'tests/test_collage_deploy_plan.py'
      - 'tests/test_collage_native_readback.py'
      - 'tests/test_collage_disposable_release_grant.py'
      - 'docs/deployment-contract-v1.md'
      - 'docs/rdte-signed-release-preflight.md'
      - '.github/workflows/qualify-deployment-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-grant-signature-negatives:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Pin isolated cryptographic verifier
        run: |
          python3 -m venv "$RUNNER_TEMP/collage-grant-venv"
          "$RUNNER_TEMP/collage-grant-venv/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: 'cryptography==46.0.4'
      - name: Synthetic signed scope/adversarial matrix (NO APPLY)
        run: "$RUNNER_TEMP/collage-grant-venv/bin/python" -m unittest discover -s tests -p 'test_collage_disposable_release_grant.py' -v
      - name: Declare source-only acceptance bound
        run: echo 'A verified signature is NOT invoking-peer authentication, provider readback, durable nonce/CAS, or any deployment authority.' >> "$GITHUB_STEP_SUMMARY"

  source-only-intent:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate schema JSON and Python source
        run: |
          set -euo pipefail
          python3 -m json.tool spec/deployment-request-v1.schema.json >/dev/null
          python3 -m py_compile tools/collage_deploy_plan.py tools/collage_native_readback.py tests/test_collage_deploy_plan.py tests/test_collage_native_readback.py
      - name: Qualify principal parity and fail-closed source intents
        run: python3 -m unittest discover -s tests -p 'test_collage_*.py' -v
      - name: Exercise checked-in source-only request against actual fixture bytes
        run: |
          set -euo pipefail
          python3 tools/collage_deploy_plan.py \
            --request examples/source-only-rdte.json \
            --artifact-root . > "$RUNNER_TEMP/collage-plan.json"
          python3 - "$RUNNER_TEMP/collage-plan.json" <<'PY'
          import json, sys
          plan = json.load(open(sys.argv[1], encoding="utf-8"))
          assert plan["classification"] == "SOURCE_VALIDATED"
          assert plan["artifact_sha256_verified"] == "1bf2f5dc94efbbf2bf8e8dde6479aca9460b35c90442649998d498bc4f890eff"
          assert not plan["provider_observed"] and not plan["mutation_authorized"]
          assert not plan["world_activated"] and not plan["artifact_format_verified"]
          PY
      - name: Bound the claim
        run: |
          echo 'Contract/source tests only: no Minecraft server, TrueNAS target, world activation, actor authentication, APPLY, or physical HIL executed.' >> "$GITHUB_STEP_SUMMARY"
