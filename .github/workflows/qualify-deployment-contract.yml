name: Qualify COLLAGE deployment contract

on:
  pull_request:
    paths:
      - 'spec/deployment-request-v1.schema.json'
      - 'tools/collage_deploy_plan.py'
      - 'tests/test_collage_deploy_plan.py'
      - 'docs/deployment-contract-v1.md'
      - '.github/workflows/qualify-deployment-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only-intent:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate schema JSON and Python source
        run: |
          set -euo pipefail
          python3 -m json.tool spec/deployment-request-v1.schema.json >/dev/null
          python3 -m py_compile tools/collage_deploy_plan.py tests/test_collage_deploy_plan.py
      - name: Qualify principal parity and fail-closed source intents
        run: python3 -m unittest discover -s tests -p 'test_collage_deploy_plan.py' -v
      - name: Bound the claim
        run: |
          echo 'Contract/source tests only: no Minecraft server, TrueNAS target, world activation, actor authentication, APPLY, or physical HIL executed.' >> "$GITHUB_STEP_SUMMARY"
