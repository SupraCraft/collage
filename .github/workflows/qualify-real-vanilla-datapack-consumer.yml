name: Qualify genuine vanilla 26.3 artifact consumer and audience parity

on:
  pull_request:
    paths:
      - 'tools/consume_vanilla_datapack_source.py'
      - 'tests/test_consume_vanilla_datapack_source.py'
      - '.github/workflows/qualify-real-vanilla-datapack-consumer.yml'
  push:
    branches:
      - main
    paths:
      - 'tools/consume_vanilla_datapack_source.py'
      - 'tests/test_consume_vanilla_datapack_source.py'
      - '.github/workflows/qualify-real-vanilla-datapack-consumer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-artifact-source-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate COLLAGE source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout accepted immutable vanilla datapack producer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SupraCraft/mc-server-images
          ref: 7f888b5829f4e5576d5ce512d86327348c43f01e
          path: .deps/vanilla-producer
          persist-credentials: false
      - name: Qualify source and adversarial consumers
        run: |
          set -euo pipefail
          python3 -m py_compile tools/collage_deploy_plan.py tools/consume_vanilla_datapack_source.py
          python3 -m unittest discover -s tests -p 'test_consume_vanilla_datapack_source.py' -v
          python3 -m unittest discover -s tests -p 'test_collage_*.py' -v
      - name: Export actual vanilla datapack bytes from accepted producer SHA
        run: |
          set -euo pipefail
          test "$(git -C .deps/vanilla-producer rev-parse HEAD)" = 7f888b5829f4e5576d5ce512d86327348c43f01e
          mkdir -p "$RUNNER_TEMP/collage-artifact"
          python3 .deps/vanilla-producer/tools/export_core_restoration_datapack_26_3.py \
            --out "$RUNNER_TEMP/collage-artifact/lantern-restoration-26.3.zip" \
            --manifest "$RUNNER_TEMP/collage-artifact/lantern-restoration-26.3.json" \
            --world-id lantern-rdte --release-id lantern-core-restore-26-3 \
            > "$RUNNER_TEMP/collage-artifact/export-receipt.json"
      - name: Real artifact bytes through one contract for three audiences
        run: |
          set -euo pipefail
          python3 tools/consume_vanilla_datapack_source.py \
            --manifest "$RUNNER_TEMP/collage-artifact/lantern-restoration-26.3.json" \
            --artifact "$RUNNER_TEMP/collage-artifact/lantern-restoration-26.3.zip" \
            --artifact-root "$RUNNER_TEMP/collage-artifact" \
            > "$RUNNER_TEMP/collage-artifact/consumer-receipt.json"
          python3 - "$RUNNER_TEMP/collage-artifact/consumer-receipt.json" <<'PY'
          import json,sys
          doc=json.load(open(sys.argv[1], encoding="utf-8"))
          assert doc["schema"]=="collage.artifact-consumer-source-parity/1"
          assert doc["classification"]=="SOURCE_ARTIFACT_AND_INTENT_PARITY_VALIDATED"
          assert set(doc["audience_receipts"])=={"human","automation","agent"}
          assert doc["candidate"]["producer"]==("SupraCraft/mc-server-images@"
            "7f888b5829f4e5576d5ce512d86327348c43f01e")
          assert not doc["real_provider_readback"]
          assert not doc["world_activated"]
          assert not doc["mutation_authorized"]
          PY
      - name: Bind the same real ZIP to the actually qualified native vanilla 26.3 App without APPLY
        run: |
          set -euo pipefail
          python3 tools/consume_vanilla_datapack_source.py \
            --manifest "$RUNNER_TEMP/collage-artifact/lantern-restoration-26.3.json" \
            --artifact "$RUNNER_TEMP/collage-artifact/lantern-restoration-26.3.zip" \
            --artifact-root "$RUNNER_TEMP/collage-artifact" \
            --native-target-profile vanilla263-250426 \
            > "$RUNNER_TEMP/collage-artifact/native-source-binding.json"
          python3 - "$RUNNER_TEMP/collage-artifact/native-source-binding.json" \
            "$RUNNER_TEMP/collage-artifact/consumer-receipt.json" <<'PY'
          import json,sys
          native=json.load(open(sys.argv[1]))
          default=json.load(open(sys.argv[2]))
          assert native["classification"]=="SOURCE_ARTIFACT_AND_INTENT_PARITY_VALIDATED"
          assert native["source_native_target_profile"]=="vanilla263-250426"
          assert native["expected_native_app"]=="rdte-t6-minecraft-vanilla-263"
          assert native["expected_truenas_version"]=="25.04.2.6"
          assert native["candidate"]==default["candidate"]
          assert native["common_intent_sha256"]!=default["common_intent_sha256"]
          assert set(native["audience_receipts"])=={"human","automation","agent"}
          assert native["real_provider_readback"] is False
          assert native["native_guest_with_this_artifact_qualified"] is False
          assert native["world_activated"] is False
          assert native["mutation_authorized"] is False
          PY
      - name: Upload public source-only evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: collage-genuine-vanilla-artifact-source-parity
          path: ${{ runner.temp }}/collage-artifact/
          if-no-files-found: error
          retention-days: 7
      - name: Declare exact excluded claims
        run: |
          echo 'SOURCE_ARTIFACT_AND_INTENT_PARITY_VALIDATED only: actual vanilla datapack ZIP verified from pinned source for human, CI and agent request shapes; no TrueNAS readback, game server boot, world activation or operational authority.' >> "$GITHUB_STEP_SUMMARY"
