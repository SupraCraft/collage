name: Qualify TrueNAS JSON-RPC client

on:
  pull_request:
    paths:
      - 'tools/qualify_truenas_jsonrpc_client.py'
      - '.github/workflows/qualify-truenas-jsonrpc-client.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout COLLAGE
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up JDK 25
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287
        with:
          distribution: zulu
          java-version: '25'
      - name: Qualify TrueNAS 25.04 JSON-RPC client contract
        run: python3 tools/qualify_truenas_jsonrpc_client.py
      - name: Publish evidence in job summary
        if: always()
        shell: bash
        run: |
          {
            echo '### EXP-000-CLOUDNET-001 TrueNAS JSON-RPC client contract'
            if [[ -f truenas-jsonrpc-client-contract-evidence.json ]]; then
              echo 'BEGIN_JSON'
              cat truenas-jsonrpc-client-contract-evidence.json
              echo 'END_JSON'
            else
              echo 'No PASS evidence file was produced.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
