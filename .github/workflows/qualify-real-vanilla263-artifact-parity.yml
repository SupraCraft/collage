name: COLLAGE real vanilla26.3 exported datapack source/3-audience parity
on:
  pull_request:
    paths:
      - 'tools/qualify_real_vanilla263_artifact_source_parity.py'
      - 'tests/test_real_vanilla263_artifact_source_parity.py'
      - '.github/workflows/qualify-real-vanilla263-artifact-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-real-datapack:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Cheap COLLAGE source parity adversarial tests
        run: |
          set -euo pipefail
          python3 -m py_compile tools/qualify_real_vanilla263_artifact_source_parity.py
          python3 -m unittest -v tests.test_real_vanilla263_artifact_source_parity
          python3 -m unittest -v tests.test_collage_deploy_plan
      - name: Checkout immutable qualified actual vanilla 26.3 datapack producer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SupraCraft/mc-server-images
          ref: 7f888b5829f4e5576d5ce512d86327348c43f01e
          path: .deps/mc-server-images
          persist-credentials: false
      - name: Export actual bounded datapack ZIP with source SHA provenance
        run: |
          set -euo pipefail
          test "$(git -C .deps/mc-server-images rev-parse HEAD)" = 7f888b5829f4e5576d5ce512d86327348c43f01e
          mkdir -p "$RUNNER_TEMP/lantern-artifact"
          python3 .deps/mc-server-images/tools/export_core_restoration_datapack_26_3.py \
            --out "$RUNNER_TEMP/lantern-artifact/lantern-restoration-26.3.zip" \
            --manifest "$RUNNER_TEMP/lantern-artifact/manifest.json" \
            --world-id lantern-rdte --release-id lantern-core-restore-26-3 \
            > "$RUNNER_TEMP/producer-source-receipt.json"
      - name: Validate actual ZIP member identities and source manifest without Minecraft mutation
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/lantern-artifact" <<'PY'
          import hashlib,json,pathlib,sys,zipfile
          root=pathlib.Path(sys.argv[1])
          m=json.loads((root/"manifest.json").read_text())
          blob=root/m["relative_path"]
          assert m["schema"]=="supracraft-vanilla-datapack-candidate/1"
          assert m["producer"]=="SupraCraft/mc-server-images@7f888b5829f4e5576d5ce512d86327348c43f01e"
          assert blob.stat().st_size==m["archive_size"] and blob.stat().st_size <= 1024*1024
          assert hashlib.sha256(blob.read_bytes()).hexdigest()==m["sha256"]
          with zipfile.ZipFile(blob) as z:
            rows=z.infolist()
            assert {x.filename for x in rows}=={x["path"] for x in m["members"]}
            assert len(rows)==3 and all(not x.is_dir() and x.file_size<1024*1024 for x in rows)
            member={x["path"]:x for x in m["members"]}
            for info in rows:
              data=z.read(info)
              assert len(data)==member[info.filename]["bytes"]
              assert hashlib.sha256(data).hexdigest()==member[info.filename]["sha256"]
          assert m["collage_deployed"] is False
          assert m["world_save_included"] is False
          PY
      - name: Independently plan identical actual artifact for human automation agent
        run: |
          set -euo pipefail
          python3 tools/qualify_real_vanilla263_artifact_source_parity.py \
            --manifest "$RUNNER_TEMP/lantern-artifact/manifest.json" \
            --artifact-root "$RUNNER_TEMP/lantern-artifact" \
            > "$RUNNER_TEMP/collage-source-parity-receipt.json"
          python3 - "$RUNNER_TEMP/collage-source-parity-receipt.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r["classification"]=="REAL_DATAPACK_SOURCE_PLAN_PARITY"
          assert r["caller_kinds"]==["human","automation","agent"]
          assert r["intents_equal"] is True
          assert r["provider_observed"] is False and r["world_activated"] is False
          assert r["permission_to_apply"] is False and r["two_rivers_complete"] is False
          assert r["physical_truenas_apply"]=="HOLD"
          PY
      - name: Preserve only bounded source-parity receipt, not world contents
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: collage-real-vanilla263-datapack-source-parity
          path: ${{ runner.temp }}/collage-source-parity-receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Evidence scope
        run: echo 'Real ZIP bytes and metadata validated; three source plans equal-intent. No TrueNAS guest, agent authentication, COLLAGE APPLY, artifact activation or complete Two Rivers world.' >> "$GITHUB_STEP_SUMMARY"
