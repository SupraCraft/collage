name: COLLAGE OP-3D same artifact / three plans / real 26.3 player causal world
on:
  pull_request:
    paths:
      - 'tools/correlate_vanilla_player_source.py'
      - 'tests/test_correlate_vanilla_player_source.py'
      - '.github/workflows/qualify-vanilla-player-artifact-correlation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: collage-op3d-player-world-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-to-real-player:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - name: Checkout exact COLLAGE consumer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout exact accepted datapack producer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SupraCraft/mc-server-images
          ref: 7f888b5829f4e5576d5ce512d86327348c43f01e
          path: .deps/vanilla-producer
          persist-credentials: false
      - name: Checkout independently accepted real player world qualifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SupraCraft/mc-server-images
          ref: 7fcfd8bd8e10fe0959b1b32524680a6c1d8317cf
          path: .deps/vanilla-player
          persist-credentials: false
      - name: Source and red/blue-gate evidence
        run: |
          set -euo pipefail
          test "$(git -C .deps/vanilla-producer rev-parse HEAD)" = 7f888b5829f4e5576d5ce512d86327348c43f01e
          test "$(git -C .deps/vanilla-player rev-parse HEAD)" = 7fcfd8bd8e10fe0959b1b32524680a6c1d8317cf
          python3 -m py_compile tools/correlate_vanilla_player_source.py
          python3 -m unittest discover -s tests -p 'test_correlate_vanilla_player_source.py' -v
          python3 -m unittest discover -s tests -p 'test_consume_vanilla_datapack_source.py' -v
          node --check .deps/vanilla-player/tools/probe_mineflayer_core_place.js
      - uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install exactly qualified protocol-777 experimental client dependencies
        run: |
          set -euo pipefail
          bash .deps/vanilla-player/tools/install_experimental_prismarine_26_3.sh "$RUNNER_TEMP/prismarine"
          echo "NODE_PATH=$RUNNER_TEMP/prismarine/runtime/node_modules" >> "$GITHUB_ENV"
      - name: Produce accepted exact inner ZIP
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/op3d"
          python3 .deps/vanilla-producer/tools/export_core_restoration_datapack_26_3.py \
            --out "$RUNNER_TEMP/op3d/lantern-restoration-26.3.zip" \
            --manifest "$RUNNER_TEMP/op3d/lantern-restoration-26.3.json" \
            --world-id lantern-rdte --release-id lantern-core-restore-26-3
      - name: Existing COLLAGE three-audience source-intent planner (READ-ONLY)
        run: |
          set -euo pipefail
          python3 tools/consume_vanilla_datapack_source.py \
            --manifest "$RUNNER_TEMP/op3d/lantern-restoration-26.3.json" \
            --artifact "$RUNNER_TEMP/op3d/lantern-restoration-26.3.zip" \
            --artifact-root "$RUNNER_TEMP/op3d" \
            > "$RUNNER_TEMP/op3d/source-plans.json"
      - name: Plan same real artifact for exact accepted native vanilla 26.3 App target
        run: |
          set -euo pipefail
          python3 tools/consume_vanilla_datapack_source.py \
            --manifest "$RUNNER_TEMP/op3d/lantern-restoration-26.3.json" \
            --artifact "$RUNNER_TEMP/op3d/lantern-restoration-26.3.zip" \
            --artifact-root "$RUNNER_TEMP/op3d" \
            --native-target-profile vanilla263-250426 \
            > "$RUNNER_TEMP/op3d/native-source-plan.json"
          python3 - "$RUNNER_TEMP/op3d/native-source-plan.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1]))
          assert p["source_native_target_profile"]=="vanilla263-250426"
          assert p["expected_native_app"]=="rdte-t6-minecraft-vanilla-263"
          assert p["expected_truenas_version"]=="25.04.2.6"
          assert p["real_provider_readback"] is False
          assert p["native_guest_with_this_artifact_qualified"] is False
          assert p["mutation_authorized"] is False
          PY
      - name: Independently play core through real vanilla world and rollback
        run: |
          set -euo pipefail
          python3 .deps/vanilla-player/tools/qualify_vanilla_datapack_player_263.py \
            --candidate "$RUNNER_TEMP/op3d/lantern-restoration-26.3.zip" \
            --manifest "$RUNNER_TEMP/op3d/lantern-restoration-26.3.json" \
            --evidence .deps/vanilla-player/probes/26.3-release-identity.json \
            --out "$RUNNER_TEMP/op3d/player-receipt.json"
      - name: Independently correlate receipts; never promote permissions
        run: |
          set -euo pipefail
          python3 tools/correlate_vanilla_player_source.py \
            --manifest "$RUNNER_TEMP/op3d/lantern-restoration-26.3.json" \
            --source-receipt "$RUNNER_TEMP/op3d/source-plans.json" \
            --player-receipt "$RUNNER_TEMP/op3d/player-receipt.json" \
            --native-source-receipt "$RUNNER_TEMP/op3d/native-source-plan.json" \
            --out "$RUNNER_TEMP/op3d/correlation.json"
          python3 - "$RUNNER_TEMP/op3d/correlation.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r["classification"]=="SAME_ARTIFACT_SOURCE_PLANS_AND_INDEPENDENT_REAL_PLAYER_ACTION_CORRELATED"
          assert set(r["audience_kinds"])=={"human","automation","agent"}
          assert r["artifact_sha256"]=="da25005e8729e6f013f7108ac5b8869dd46323befc78efdae18221b26cafe5f8"
          assert r["native_app_artifact_source_intent_bound"] is True
          assert r["native_app_expected"]=="rdte-t6-minecraft-vanilla-263"
          assert r["native_guest_with_artifact_qualified"] is False
          assert r["native_artifact_activation_performed"] is False
          assert r["offline_client_action_independently_verified"]
          assert r["real_vanilla_datapack_consequence_verified"]
          assert r["postrollback_same_action_does_not_trigger_datapack"]
          for flag in ("collage_managed_deployment","truenas_provider_observed",
                       "authenticated_game_client_verified",
                       "stock_client_visual_presentation_verified",
                       "principal_authorization_verified","operational_selection"):
              assert r[flag] is False, flag
          assert r["physical_truenas_apply"]=="HOLD"
          PY
      - name: Retain small receipts only; no JAR, game worlds or client session secrets
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: collage-op3d-source-player-world-correlation
          path: |
            ${{ runner.temp }}/op3d/source-plans.json
            ${{ runner.temp }}/op3d/native-source-plan.json
            ${{ runner.temp }}/op3d/player-receipt.json
            ${{ runner.temp }}/op3d/correlation.json
          retention-days: 14
          if-no-files-found: warn
      - name: Scope
        if: always()
        run: |
          echo 'Real experimental offline client input and separate vanilla world qualification using same artifact as three COLLAGE source-intents. This is not a managed COLLAGE deployment, stock client/UI, user IAM, Two Rivers, TrueNAS or physical APPLY.' >> "$GITHUB_STEP_SUMMARY"
